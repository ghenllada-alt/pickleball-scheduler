<!DOCTYPE html>
<html>

<head>

<title>Pickleball Scheduler</title>

<style>

body{
    font-family:Arial,sans-serif;
    max-width:1200px;
    margin:auto;
    padding:20px;
    background:#f5f5f5;
}

.box{
    background:white;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
}

h1{
    margin-bottom:30px;
}

.player-row{
    display:flex;
    gap:10px;
    margin-bottom:10px;
}

input,
select,
button{

    padding:10px;
    margin:5px;
}

input{
    min-width:200px;
}

button{
    cursor:pointer;
}

.settings-row{
    margin-bottom:20px;
}

.checkbox-row{
    margin-bottom:15px;
}

.player-name{
    flex:1;
}

.rating{
    width:100px;
}

.remove-btn{
    background:#d9534f;
    color:white;
    border:none;
}

.add-btn{
    background:#28a745;
    color:white;
    border:none;
}

.generate-btn{
    background:#007bff;
    color:white;
    border:none;
    font-size:16px;
}

</style>

</head>

<body>

<h1>🏓 Pickleball Scheduler</h1>

<div class="box">

<h2>Settings</h2>

<div class="settings-row">

<label>
Number of Courts
</label>

<br>

<input
type="number"
id="courts"
value="2"
min="1"
max="10">

</div>

<div class="settings-row">

<label>
Rating Scale
</label>

<br>

<select
id="ratingScale"
onchange="refreshRatings()">

<option value="3">
1-3
</option>

<option value="4">
1-4
</option>

<option value="5">
1-5
</option>

</select>

</div>

<div class="settings-row">

<label>
Target Games Per Player
</label>

<br>

<input
type="number"
id="targetGames"
value="4"
min="1"
max="20">

</div>

<div class="settings-row">

<label>
Maximum Games Per Player
</label>

<br>

<input
type="number"
id="maxGames"
value="6"
min="1"
max="30">

</div>

<div class="checkbox-row">

<label>

<input
type="checkbox"
id="continueAfterTarget"
checked>

Continue Scheduling After Target Reached

</label>

</div>

<div class="checkbox-row">

<label>

<input
type="checkbox"
id="avoidPartners"
checked>

Avoid Repeat Partners

</label>

</div>

<div class="checkbox-row">

<label>

<input
type="checkbox"
id="avoidOpponents"
checked>

Avoid Repeat Opponents

</label>

</div>

</div>

<div class="box">

<h2>Players</h2>

<div id="players"></div>

<button
class="add-btn"
onclick="addPlayer()">

Add Player

</button>

</div>

<div class="box">

<button
class="generate-btn"
onclick="generateSchedule()">

Generate Schedule

</button>

<div id="results"></div>

</div>
