<!DOCTYPE html>
<html>
<head>
    <title>Pickleball Scheduler</title>

    <style>
        body{
            font-family:Arial;
            max-width:1000px;
            margin:auto;
            padding:20px;
            background:#f5f5f5;
        }

        .box{
            background:white;
            padding:20px;
            border-radius:10px;
            margin-bottom:20px;
        }

        input,select{
            padding:8px;
            margin:5px;
        }

        button{
            padding:10px;
            cursor:pointer;
        }
    </style>
</head>

<body>

<h1>🏓 Pickleball Scheduler</h1>

<div class="box">

<h2>Settings</h2>

<label>Number of Courts</label>
<input
    type="number"
    id="courts"
    value="2"
    min="1"
    max="10">

<br><br>

<label>Maximum Rating Scale</label>

<select id="ratingScale">

<option value="3">1-3</option>
<option value="4">1-4</option>
<option value="5">1-5</option>

</select>

<br><br>

<label>Number of Rounds</label>

<input
    type="number"
    id="rounds"
    value="10"
    min="1">

</div>

<div class="box">

<h2>Players</h2>

<div id="players">

</div>

<button onclick="addPlayer()">
Add Player
</button>

</div>

<div class="box">

<button onclick="generateSchedule()">
Generate Schedule
</button>

<div id="results"></div>

</div>

            <option>3</option>
            <option>4</option>
            <option>5</option>
        </select>
    `;

    document
    .getElementById("players")
    .appendChild(div);
}
